name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Dependency audit (critical)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical
      - name: Block committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$'; then
            echo 'Do not commit .env files' >&2
            exit 1
          fi
          if git grep -I -nE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY' -- ':!.github' ':!certs' ':!*.md'; then
            echo 'Private key material in tree' >&2
            exit 1
          fi
      - name: Shell syntax
        run: |
          bash -n scripts/apply-staging.sh
          bash -n scripts/deploy-staging-prebuilt.sh
          bash -n scripts/pack-staging-prebuilt.sh
          bash -n scripts/workflow-deploy-staging.sh
          bash -n scripts/lib/vps.sh
